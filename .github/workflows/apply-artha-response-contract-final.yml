name: Apply final ArthaMind response contract

on:
  push:
    branches: [artha-response-contract-v4]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply corrected response contract
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-artha-response-contract.yml').read_text()
          start = workflow.index('      - name: Apply response-engine contract\n')
          marker = '        run: |\n'
          run_start = workflow.index(marker, start) + len(marker)
          run_end = workflow.index('\n      - name: Install dependencies\n', run_start)
          script = textwrap.dedent(workflow[run_start:run_end])
          script = script.replace(
              '    serializer.strip(),\n    text,\n    count=1,',
              '    lambda _match: serializer.strip(),\n    text,\n    count=1,',
              1,
          )
          exec(compile(script, 'artha-response-contract-patch.py', 'exec'), {})
          path = Path('server/aiResponseStandard.ts')
          text = path.read_text()
          old = 'B. example.inputs = 2 to 6 short assumptions/context items.'
          new = 'B. Assumptions and context: example.inputs = 2 to 6 short assumptions/context items.'
          if old not in text:
              raise SystemExit('Assumptions label insertion point not found')
          path.write_text(text.replace(old, new, 1))
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Response contract tests
        run: npx vitest run tests/arthaResponseContract.test.ts tests/aiResponseStandard.test.ts tests/groqService.test.ts
      - name: Contract assertions
        run: |
          grep -q "Quick answer" server/aiResponseStandard.ts
          grep -q "Professional report" server/aiResponseStandard.ts
          grep -q "Assumptions and context" server/aiResponseStandard.ts
          grep -q "Final result and interpretation" src/components/ai/StructuredFinancialAnswer.tsx
          grep -q "Limitations and verification" server/cryptoService.ts
          grep -q "official source" server/aiResponseStandard.ts
      - name: Commit validated source changes
        run: |
          git checkout -- api/index.js || true
          git config user.name "SHREYASH SINGH"
          git config user.email "shreyashsinghegi2@gmail.com"
          git add server/aiResponseStandard.ts server/cryptoService.ts src/components/ai/StructuredFinancialAnswer.tsx src/components/finance/FinanceAssistantDrawer.tsx tests/arthaResponseContract.test.ts
          git commit -m "Enforce ArthaMind financial response contract"
          git push origin HEAD:artha-response-contract-v4
