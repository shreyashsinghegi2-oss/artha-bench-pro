name: ArthaBench CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Types, ESLint, Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint # tsc --noEmit
      - run: npm run lint:eslint
      - run: npm run format:check

  unit:
    name: Vitest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5 # integration tests spawn the RAG sidecar and the precision engine
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            rag/requirements*.txt
            precision-engine/requirements*.txt
      - run: pip install numpy -r precision-engine/requirements.txt
      - run: npm ci
      # Fails if core-logic coverage drops below the thresholds in vitest.config.ts (80% lines/functions/statements).
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  rag:
    name: RAG sidecar (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rag/requirements*.txt
      - run: pip install -r rag/requirements.txt -r rag/requirements-dev.txt
      - run: python -m pytest rag/tests -q --cov=rag --cov-report=term-missing

  build:
    name: Build (web, API bundle, WS service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:ws
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: Playwright e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel (production) + smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, rag, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set; skipping CLI deploy (Vercel's Git integration may still deploy)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm i -g vercel@latest
      - if: steps.creds.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ok == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: echo "url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          for path in / /api/health; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$path") || code=000
              [ "$code" = "200" ] && break
              echo "attempt $i: $path -> $code"; sleep $((i * 5))
            done
            [ "$code" = "200" ] || { echo "::error::smoke test failed for $path ($code)"; exit 1; }
            echo "$path -> 200"
          done
          curl -s --max-time 20 "$url/api/health" | grep -q '"status"' || { echo "::error::/api/health body unexpected"; exit 1; }
