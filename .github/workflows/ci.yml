name: Artha Bench CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run lint -- --pretty false 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report type-check diagnostics
        if: github.event_name == 'pull_request' && steps.typecheck.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Artha Bench CI — TypeScript diagnostics'
            echo
            echo '```text'
            tail -n 120 /tmp/typecheck.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - name: Fail on type-check errors
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
