name: Free Market Reliability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-market-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Market and assistant reliability tests
        run: npx vitest run tests/freeMarketReliability.test.ts tests/aiAssistantResilience.test.ts
      - name: Production build
        run: npm run build
