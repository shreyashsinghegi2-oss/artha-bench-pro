name: Validate overview navigation polish

on:
  push:
    branches: [overview-navigation-polish]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overview-navigation-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply dashboard wiring and behavior-neutral TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('src/components/dashboard/DashboardView.tsx')
          text = dashboard.read_text()
          old_import = "import { IndiaMarketTicker } from './IndiaMarketTicker';"
          new_import = "import { IndiaMarketTicker } from './IndiaMarketTicker';\nimport { BusinessNewsTicker } from './BusinessNewsTicker';"
          if "import { BusinessNewsTicker } from './BusinessNewsTicker';" not in text:
              if old_import not in text:
                  raise SystemExit('IndiaMarketTicker import not found')
              text = text.replace(old_import, new_import, 1)
          text = text.replace("  const latestHeadline = news[0] ?? null;\n", "", 1)
          start_marker = '          <div className="overflow-hidden rounded-xl border border-line bg-[#101A2E] text-white shadow-sm" aria-label="Latest business headline">'
          end_marker = '          <DashboardAssistant '
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + "          <BusinessNewsTicker items={news} onOpenFeed={() => onNavigate('news')} />\n" + text[end:]
          elif 'BusinessNewsTicker items={news}' not in text:
              raise SystemExit('Existing latest headline block not found')
          dashboard.write_text(text)

          account = Path('src/components/account/PersonalAccountControls.tsx')
          text = account.read_text()
          old = "const Context=({label,desc,checked,change}:{label:string,desc:string,checked:boolean,change:(v:boolean)=>void})=>"
          new = "const Context:React.FC<{label:string;desc:string;checked:boolean;change:(v:boolean)=>void}>=({label,desc,checked,change})=>"
          if old in text:
              text = text.replace(old, new, 1)
          account.write_text(text)

          assistant = Path('src/components/dashboard/DashboardAssistant.tsx')
          text = assistant.read_text()
          old = "      const personalDataUsed = 'personalDataUsed' in response ? response.personalDataUsed : false;\n      const personalContextReferences = 'personalContextReferences' in response ? response.personalContextReferences : [];"
          new = "      const personalDataUsed = 'personalDataUsed' in response ? Boolean(response.personalDataUsed) : false;\n      const personalContextReferences = 'personalContextReferences' in response && Array.isArray(response.personalContextReferences)\n        ? response.personalContextReferences.filter((item): item is string => typeof item === 'string')\n        : [];"
          if old in text:
              text = text.replace(old, new, 1)
          assistant.write_text(text)

          expenses = Path('src/components/expenses/ExpensesView.tsx')
          text = expenses.read_text()
          old = "  const categoryRanking = useMemo(\n    () => Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]),\n    [categoryTotals],\n  );"
          new = "  const categoryRanking = useMemo<Array<[string, number]>>(\n    () => Object.entries(categoryTotals)\n      .map(([category, total]) => [category, Number(total)] as [string, number])\n      .sort((a, b) => b[1] - a[1]),\n    [categoryTotals],\n  );"
          if old in text:
              text = text.replace(old, new, 1)
          expenses.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Navigation and interaction assertions
        shell: python
        run: |
          from pathlib import Path

          route_text = Path('src/appRoutes.ts').read_text()
          expected_routes = [
              "overview: '/finance/overview'",
              "income: '/finance/income'",
              "expenses: '/finance/expenses'",
              "budgeting: '/finance/budgeting'",
              "'finance-reports': '/finance/reports'",
              "'emi-manager': '/finance/emi-manager'",
          ]
          missing_routes = [item for item in expected_routes if item not in route_text]
          if missing_routes:
              raise SystemExit(f'Missing canonical finance routes: {missing_routes}')

          finance_nav = Path('src/components/finance/FinanceWorkspaceNavigation.tsx').read_text()
          for item in ['href={href}', 'aria-current={active', 'onNavigate(id)']:
              if item not in finance_nav:
                  raise SystemExit(f'Finance navigation assertion missing: {item}')

          header = Path('src/components/Header.tsx').read_text()
          for item in ["pathForDestination('overview')", 'artha-main-app-menu', 'AppSearch', 'FINANCE_NAV_ITEMS']:
              if item not in header:
                  raise SystemExit(f'Header assertion missing: {item}')
          if 'Settings & Controls' in header:
              raise SystemExit('Standalone Settings & Controls plate still present')

          dashboard = Path('src/components/dashboard/DashboardView.tsx').read_text()
          for item in ['BusinessNewsTicker items={news}', 'loadDashboard()', "onNavigate('evaluation-lab')", "onNavigate('connections')", "onNavigate('markets')", "onNavigate('news')"]:
              if item not in dashboard:
                  raise SystemExit(f'Dashboard action assertion missing: {item}')

          assistant = Path('src/components/dashboard/DashboardAssistant.tsx').read_text()
          if "onNavigate('tutor')" not in assistant:
              raise SystemExit('Open full tutor action is not wired')

      - name: Commit validated source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "SHREYASH SINGH"
          git config user.email "shreyashsinghegi2@gmail.com"
          git rm .github/workflows/overview-navigation-polish.yml
          git add src/components/dashboard/DashboardView.tsx src/components/account/PersonalAccountControls.tsx src/components/dashboard/DashboardAssistant.tsx src/components/expenses/ExpensesView.tsx
          git commit -m "Validate overview navigation and ticker interactions"
          git push origin HEAD:overview-navigation-polish
