name: Personal AI and Decision Replay smoke

on:
  push:
    branches: [fix-personal-ai-decision-replay]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-personal-ai-decision-replay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Create temporary Supabase account
        shell: bash
        run: |
          EMAIL="ci.personal.replay.${GITHUB_RUN_ID}@example.com"
          PASSWORD="ReplayTest!${GITHUB_RUN_ID}"
          BODY=$(jq -nc --arg email "$EMAIL" --arg password "$PASSWORD" '{mode:"signup",email:$email,password:$password,fullName:"CI Replay User",country:"India",financialDataConsent:true}')
          curl -fsS -X POST 'https://agjbvoosukxfvrritgto.supabase.co/functions/v1/signup-account' \
            -H 'Origin: https://artha-bench-pro.vercel.app' \
            -H 'Content-Type: application/json' \
            --data "$BODY" > signup.json
          ACCESS_TOKEN=$(jq -r '.session.access_token // empty' signup.json)
          USER_ID=$(jq -r '.session.user.id // empty' signup.json)
          test -n "$ACCESS_TOKEN"
          test -n "$USER_ID"
          echo "TEST_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "USER_ID=$USER_ID" >> "$GITHUB_ENV"

      - name: Seed private workspace through RLS
        shell: bash
        env:
          PUBLISHABLE_KEY: sb_publishable_KOdXB7LW5Ho5hDjsi3GMiw_xdogy5oR
        run: |
          node <<'NODE' > seed.json
          const userId = process.env.USER_ID;
          const month = new Date().toISOString().slice(0,7);
          const today = new Date().toISOString().slice(0,10);
          const rows = [
            {storage_key:'artha_income_sources_v1',payload:JSON.stringify({version:1,sources:[{id:'ci-income',type:'Salary',amount:100000,currency:'INR',frequency:'Monthly',description:'CI salary',taxStatus:'Post-tax',startDate:today,tags:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]})},
            {storage_key:'artha_expenses_v1',payload:JSON.stringify({version:1,records:[{id:'ci-expense',amount:30000,category:'Housing/Rent',date:today,merchant:'CI Rent',paymentMethod:'Bank Transfer',notes:'',recurring:true,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]})},
            {storage_key:'artha_budgets_v1',payload:JSON.stringify({version:1,budgets:[{id:'ci-budget',name:'CI Budget',month,notes:'',savingsTarget:20000,categories:[{id:'ci-cat',category:'Housing/Rent',plannedAmount:40000,warningThreshold:80}],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]})},
            {storage_key:'artha_emi_records_v1',payload:JSON.stringify({version:2,records:[{id:'ci-emi',name:'CI Education Loan',lender:'CI Lender',loanType:'Education loan',originalLoanAmount:200000,outstandingBalance:150000,annualInterestRate:10,emiAmount:5000,startDate:today,nextDueDate:today,tenureMonths:36,remainingInstallments:30,paymentFrequency:'monthly',notes:'',status:'active',typeDetails:{},payments:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]})}
          ].map(row => ({user_id:userId,...row}));
          process.stdout.write(JSON.stringify(rows));
          NODE
          curl -fsS -X POST 'https://agjbvoosukxfvrritgto.supabase.co/rest/v1/user_workspace_state?on_conflict=user_id,storage_key' \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            --data-binary @seed.json

      - name: Start built server
        shell: bash
        run: |
          NODE_ENV=production PORT=3000 npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Personalized ArthaMind returns grounded response
        shell: bash
        run: |
          cat > personal.json <<'JSON'
          {
            "question":"Summarize my recorded income and expenses and the dashboard data basis.",
            "history":[],
            "settings":{"income":true,"expenses":true,"budgets":true,"emis":true,"goals":false,"personalFinance":true,"budgetsAndGoals":true,"paperPortfolio":false,"learningProgress":false,"saveConversation":false},
            "publicContext":{"capturedAt":"2026-09-01T00:00:00.000Z","selectedSymbol":"SPY","selectedRange":"1m","selectedCountry":"us","quotes":[{"symbol":"SPY","price":650,"changePercent":0.4,"freshness":"delayed","providerName":"Yahoo Finance"}],"marketHistory":{"symbol":"SPY","range":"1m","pointCount":23,"startDate":"2026-08-01","endDate":"2026-08-29","startPrice":630,"latestPrice":650,"high":655,"low":625,"returnPercent":3.17},"economicIndicators":[],"providerHealth":{"connected":3,"total":4,"connectedProviders":["Yahoo Finance","FRED","Groq"],"unavailableProviders":["Finnhub"]},"latestEvaluation":null}
          }
          JSON
          curl -fsS -X POST http://127.0.0.1:3000/api/personal/assistant \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-binary @personal.json > personal-response.json
          jq -e '.personalDataUsed == true' personal-response.json
          jq -e '.personalContextReferences | length >= 3' personal-response.json
          jq -e '.structuredAnswer.directAnswer | length > 0' personal-response.json

      - name: Decision Replay calculates deterministic delta
        shell: bash
        run: |
          curl -fsS -X POST http://127.0.0.1:3000/api/personal/decision-replay \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data '{"horizonMonths":6,"changes":{"monthlyIncomeDelta":5000,"expenseReductionPercent":10,"additionalMonthlyExpense":0,"newMonthlyEmi":8000,"savingsTargetDelta":0},"explain":false}' > replay.json
          jq -e '.replay.baseline.monthlyIncome == 100000' replay.json
          jq -e '.replay.baseline.recordedMonthlyExpenses == 30000' replay.json
          jq -e '.replay.scenario.activePlusNewMonthlyEmi == 13000' replay.json
          jq -e '.replay.dataBasis.completeness == "High"' replay.json
          jq -e '.replay.impact.horizonCashFlowChange != null' replay.json

      - name: Stop server
        if: always()
        run: test ! -f server.pid || kill "$(cat server.pid)" || true
