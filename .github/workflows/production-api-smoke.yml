name: Validate latest main

on:
  push:
    branches: [api-smoke-test]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Auth and demo assertions
        shell: bash
        run: |
          test -f src/components/dashboard/PublicFinanceOverview.tsx
          grep -q "Sign in securely" src/components/auth/AuthModal.tsx
          grep -q "isSocialProviderEnabled" src/services/supabaseRest.ts
          if grep -R -n -E 'Try sample workspace|Fictional sample workspace|Demo Mode' src --exclude-dir='test' --exclude='*.test.*'; then
            echo "User-facing demo/sample copy still exists"
            exit 1
          fi
