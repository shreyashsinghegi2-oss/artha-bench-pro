name: Validate auth overview fix

on:
  push:
    branches: [api-smoke-test]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: auth-overview-fix-verified

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify requested fixes
        shell: bash
        run: |
          grep -q "<DashboardView onNavigate" src/App.tsx
          if grep -q "PublicFinanceOverview" src/App.tsx; then
            echo "Simplified overview replacement is still active"
            exit 1
          fi
          grep -q "resendSignupConfirmation" src/auth/AuthContext.tsx
          grep -q "auth/v1/resend" src/services/supabaseRest.ts
          grep -q "redirect_to=" src/services/supabaseRest.ts
