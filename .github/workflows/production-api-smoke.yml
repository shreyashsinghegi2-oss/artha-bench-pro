name: Validate immediate Supabase email signup

on:
  push:
    branches: [api-smoke-test]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Connect email signup to Supabase signup function
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/supabaseRest.ts')
          text = path.read_text()

          old_signin = '''export async function signInWithPassword(email: string, password: string): Promise<AuthSession> {
            const { url } = config();
            const payload = await requestJSON<any>(`${url}/auth/v1/token?grant_type=password`, {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({ email, password }),
            });
            const session = normalizeSession(payload);
            if (!session) throw new Error('Sign-in succeeded but no session was returned.');
            return session;
          }'''.replace('          ', '')
          new_signin = '''export async function signInWithPassword(email: string, password: string): Promise<AuthSession> {
            const { url } = config();
            try {
              const payload = await requestJSON<any>(`${url}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ email, password }),
              });
              const session = normalizeSession(payload);
              if (!session) throw new Error('Sign-in succeeded but no session was returned.');
              return session;
            } catch (error) {
              const message = error instanceof Error ? error.message : '';
              if (!/email not confirmed/i.test(message)) throw error;
              const recovered = await requestJSON<any>(`${url}/functions/v1/signup-account`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ mode: 'recover', email, password }),
              });
              const session = normalizeSession(recovered?.session);
              if (!session) throw new Error('Account recovery succeeded but no session was returned.');
              return session;
            }
          }'''.replace('          ', '')
          if old_signin not in text:
              raise SystemExit('signInWithPassword source pattern missing')
          text = text.replace(old_signin, new_signin, 1)

          old_signup = '''export async function signUpWithPassword(input: {
            email: string;
            password: string;
            fullName: string;
            country: string;
            financialDataConsent: boolean;
          }): Promise<{ session: AuthSession | null; user: AuthUser | null }> {
            const { url } = config();
            const redirectTo = browserRedirect('callback');
            const endpoint = redirectTo ? `${url}/auth/v1/signup?redirect_to=${encodeURIComponent(redirectTo)}` : `${url}/auth/v1/signup`;
            const payload = await requestJSON<any>(endpoint, {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({
                email: input.email,
                password: input.password,
                data: {
                  full_name: input.fullName,
                  country: input.country,
                  personal_data_insights_enabled: input.financialDataConsent,
                },
              }),
            });
            return { session: normalizeSession(payload), user: payload?.user ?? null };
          }'''.replace('          ', '')
          new_signup = '''export async function signUpWithPassword(input: {
            email: string;
            password: string;
            fullName: string;
            country: string;
            financialDataConsent: boolean;
          }): Promise<{ session: AuthSession | null; user: AuthUser | null }> {
            const { url } = config();
            const payload = await requestJSON<any>(`${url}/functions/v1/signup-account`, {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({
                mode: 'signup',
                email: input.email,
                password: input.password,
                fullName: input.fullName,
                country: input.country,
                financialDataConsent: input.financialDataConsent,
              }),
            });
            const session = normalizeSession(payload?.session);
            return { session, user: session?.user ?? null };
          }'''.replace('          ', '')
          if old_signup not in text:
              raise SystemExit('signUpWithPassword source pattern missing')
          text = text.replace(old_signup, new_signup, 1)
          path.write_text(text)

      - name: Add deployed Edge Function source to repository
        shell: bash
        run: |
          mkdir -p supabase/functions/signup-account
          cat > supabase/functions/signup-account/index.ts <<'EOF'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          import { createClient } from "npm:@supabase/supabase-js@2";

          const allowedOrigins = new Set([
            "https://artha-bench-pro.vercel.app",
            "http://localhost:5173",
            "http://localhost:3000",
          ]);

          function cors(origin: string | null) {
            const allowed = origin && allowedOrigins.has(origin) ? origin : "https://artha-bench-pro.vercel.app";
            return {
              "Access-Control-Allow-Origin": allowed,
              "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
              "Access-Control-Allow-Methods": "POST, OPTIONS",
              "Vary": "Origin",
            };
          }

          function json(status: number, body: Record<string, unknown>, origin: string | null) {
            return new Response(JSON.stringify(body), {
              status,
              headers: { ...cors(origin), "Content-Type": "application/json", "Cache-Control": "no-store" },
            });
          }

          function validEmail(email: string) {
            return email.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          }

          Deno.serve(async (req) => {
            const origin = req.headers.get("Origin");
            if (req.method === "OPTIONS") return new Response("ok", { headers: cors(origin) });
            if (req.method !== "POST") return json(405, { error: "Method not allowed" }, origin);
            if (origin && !allowedOrigins.has(origin)) return json(403, { error: "Origin not allowed" }, origin);

            const supabaseUrl = Deno.env.get("SUPABASE_URL");
            const anonKey = Deno.env.get("SUPABASE_ANON_KEY");
            const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");
            if (!supabaseUrl || !anonKey || !serviceRoleKey) return json(500, { error: "Authentication service is not configured" }, origin);

            let body: any;
            try {
              const raw = await req.text();
              if (raw.length > 4096) return json(413, { error: "Request too large" }, origin);
              body = JSON.parse(raw);
            } catch {
              return json(400, { error: "Invalid request" }, origin);
            }

            const mode = body?.mode === "recover" ? "recover" : "signup";
            const email = String(body?.email || "").trim().toLowerCase();
            const password = String(body?.password || "");
            const fullName = String(body?.fullName || "").trim();
            const country = String(body?.country || "India").trim();
            const financialDataConsent = body?.financialDataConsent === true;

            if (!validEmail(email)) return json(400, { error: "Enter a valid email address" }, origin);
            if (password.length < 8 || password.length > 128) return json(400, { error: "Password must be 8–128 characters" }, origin);
            if (mode === "signup" && (!fullName || fullName.length > 100)) return json(400, { error: "Enter your full name" }, origin);
            if (mode === "signup" && (!country || country.length > 80)) return json(400, { error: "Enter a valid country or region" }, origin);

            const admin = createClient(supabaseUrl, serviceRoleKey, { auth: { persistSession: false, autoRefreshToken: false } });
            const publicClient = createClient(supabaseUrl, anonKey, { auth: { persistSession: false, autoRefreshToken: false } });

            const firstAttempt = await publicClient.auth.signInWithPassword({ email, password });
            if (!firstAttempt.error && firstAttempt.data.session) return json(200, { session: firstAttempt.data.session, existing: true }, origin);

            if (/email not confirmed/i.test(firstAttempt.error?.message || "")) {
              const { data: listed, error: listError } = await admin.auth.admin.listUsers({ page: 1, perPage: 1000 });
              if (!listError) {
                const user = listed.users.find((candidate) => candidate.email?.toLowerCase() === email);
                if (user && !user.email_confirmed_at) {
                  const { error: confirmError } = await admin.auth.admin.updateUserById(user.id, { email_confirm: true });
                  if (!confirmError) {
                    const recovered = await publicClient.auth.signInWithPassword({ email, password });
                    if (!recovered.error && recovered.data.session) return json(200, { session: recovered.data.session, recovered: true }, origin);
                  }
                }
              }
              return json(401, { error: "This account could not be recovered. Use Forgot password or contact support." }, origin);
            }

            if (mode === "recover") return json(401, { error: "Invalid email or password" }, origin);

            const { data: created, error: createError } = await admin.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
              user_metadata: {
                full_name: fullName,
                country,
                personal_data_insights_enabled: financialDataConsent,
              },
            });
            if (createError) return json(409, { error: "An account with this email already exists. Sign in with its password or use Forgot password." }, origin);
            if (!created.user) return json(500, { error: "Account could not be created" }, origin);

            const signedIn = await publicClient.auth.signInWithPassword({ email, password });
            if (signedIn.error || !signedIn.data.session) return json(500, { error: "Account created, but automatic sign-in failed. Please sign in once." }, origin);
            return json(201, { session: signedIn.data.session, created: true }, origin);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Integration test immediate signup
        shell: bash
        env:
          SUPABASE_URL: https://agjbvoosukxfvrritgto.supabase.co
          SUPABASE_KEY: sb_publishable_KOdXB7LW5Ho5hDjsi3GMiw_xdogy5oR
        run: |
          EMAIL="arthabench-ci-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CI-${GITHUB_RUN_ID}-Secure9!"
          export EMAIL PASSWORD
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/signup-account" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Origin: https://artha-bench-pro.vercel.app" \
            --data "{\"mode\":\"signup\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"fullName\":\"CI Auth User\",\"country\":\"India\",\"financialDataConsent\":false}" \
            > /tmp/signup.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/signup.json'))
          session=data.get('session') or {}
          user=session.get('user') or {}
          assert session.get('access_token'), data
          assert session.get('refresh_token'), data
          assert user.get('email') == os.environ['EMAIL'], data
          assert user.get('email_confirmed_at'), data
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            > /tmp/login.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/login.json'))
          assert data.get('access_token'), data
          assert data.get('user', {}).get('email_confirmed_at'), data
          PY

      - name: Verify source behavior
        shell: bash
        run: |
          grep -q "functions/v1/signup-account" src/services/supabaseRest.ts
          grep -q "mode: 'recover'" src/services/supabaseRest.ts
          grep -q "mode: 'signup'" src/services/supabaseRest.ts
          grep -q "<DashboardView onNavigate" src/App.tsx
          if grep -q "PublicFinanceOverview" src/App.tsx; then
            echo "Simplified overview replacement is still active"
            exit 1
          fi

      - name: Push validated signup fix to main
        shell: bash
        run: |
          git checkout -- api/index.js || true
          git config user.name "SHREYASH SINGH"
          git config user.email "shreyashsinghegi2@gmail.com"
          git add src/services/supabaseRest.ts supabase/functions/signup-account/index.ts
          git commit -m "Enable immediate Supabase email signup"
          git push origin HEAD:main
