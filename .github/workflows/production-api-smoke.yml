name: Production API smoke

on:
  push:
    branches: [api-smoke-test]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production feature APIs
        shell: bash
        run: |
          set -u
          base="https://artha-bench-pro.vercel.app"

          get_call() {
            endpoint="$1"
            echo "===== GET ${endpoint} ====="
            tmp=$(mktemp)
            code=$(curl -L -sS --max-time 60 -o "$tmp" -w "%{http_code}" "${base}${endpoint}" || true)
            echo "HTTP ${code}"
            head -c 10000 "$tmp" || true
            echo
            rm -f "$tmp"
          }

          get_call "/api/health"
          get_call "/api/diagnostics"
          get_call "/api/markets/history?symbol=SPY&range=1m"
          get_call "/api/company/intelligence?symbol=AAPL"
          get_call "/api/news?category=business"
          get_call "/api/crypto/klines?symbol=BTCUSDT&interval=1m"

          echo "===== POST /api/tutor ====="
          tmp=$(mktemp)
          code=$(curl -L -sS --max-time 90 -o "$tmp" -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -X POST "${base}/api/tutor" \
            --data '{"userPrompt":"Explain the latest available US unemployment rate in simple language.","context":{"country":"US","currency":"USD","language":"english","level":"beginner","mode":"explain","detail":"short","useOfficialSources":true}}' || true)
          echo "HTTP ${code}"
          head -c 12000 "$tmp" || true
          echo
          rm -f "$tmp"
