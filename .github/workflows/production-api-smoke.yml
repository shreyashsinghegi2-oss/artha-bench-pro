name: Production API smoke

on:
  push:
    branches: [api-smoke-test]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call import diagnostics and production API
        shell: bash
        run: |
          set -u
          base="https://artha-bench-pro.vercel.app"
          endpoints=(
            "/__probe"
            "/__probe-express"
            "/__probe-imports"
            "/__probe-routes"
            "/api/health"
          )
          for endpoint in "${endpoints[@]}"; do
            echo "===== ${endpoint} ====="
            tmp=$(mktemp)
            code=$(curl -L -sS --max-time 40 -o "$tmp" -w "%{http_code}" "${base}${endpoint}" || true)
            echo "HTTP ${code}"
            cat "$tmp" || true
            echo
            rm -f "$tmp"
          done
