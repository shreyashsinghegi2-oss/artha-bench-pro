name: Validate Google auth UI removal

on:
  push:
    branches: [remove-unavailable-google-auth-ui]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-unavailable-google-auth-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unavailable Google auth entry points
        shell: python
        run: |
          from pathlib import Path

          modal = Path('src/components/auth/AuthModal.tsx')
          text = modal.read_text()
          text = text.replace("import { isSocialProviderEnabled, resendSignupConfirmation } from '../../services/supabaseRest';", "import { resendSignupConfirmation } from '../../services/supabaseRest';")
          text = text.replace("  const [googleAvailable, setGoogleAvailable] = useState<boolean | null>(null);\n", "")

          effect_start = "  useEffect(() => {\n    if (!auth.authOpen || !auth.configured) {\n      setGoogleAvailable(false);\n      return;\n    }\n    let active = true;\n    setGoogleAvailable(null);\n    void isSocialProviderEnabled('google').then((enabled) => {\n      if (active) setGoogleAvailable(enabled);\n    });\n    return () => { active = false; };\n  }, [auth.authOpen, auth.configured]);\n\n"
          if effect_start not in text:
              raise SystemExit('Google availability effect not found in AuthModal')
          text = text.replace(effect_start, '', 1)

          google_handler = "  const beginGoogle = () => {\n    if (!googleAvailable) return;\n    setError(null);\n    try {\n      auth.continueWithGoogle();\n    } catch (err) {\n      setError(err instanceof Error ? err.message : 'Google sign-in could not be started.');\n    }\n  };\n\n"
          if google_handler not in text:
              raise SystemExit('Google handler not found in AuthModal')
          text = text.replace(google_handler, '', 1)

          ui_start = '                <button type="button" disabled={!auth.configured || busy || googleAvailable !== true} onClick={beginGoogle}'
          email_start = '                <div>\n                  <label className={labelClass} htmlFor="login-email">Email address</label>'
          if ui_start not in text or email_start not in text:
              raise SystemExit('Google login UI markers not found in AuthModal')
          start = text.index(ui_start)
          end = text.index(email_start, start)
          text = text[:start] + email_start + text[end + len(email_start):]
          modal.write_text(text)

          gate = Path('src/components/auth/AuthGateView.tsx')
          text = gate.read_text()
          text = text.replace("import React, { useEffect, useState } from 'react';", "import React from 'react';")
          text = text.replace("import { isSocialProviderEnabled } from '../../services/supabaseRest';\n", "")

          state_start = "  const auth = useAuth();\n  const [error, setError] = useState<string | null>(null);\n  const [googleAvailable, setGoogleAvailable] = useState<boolean | null>(null);\n\n"
          replacement = "  const auth = useAuth();\n\n"
          if state_start not in text:
              raise SystemExit('Google state block not found in AuthGateView')
          text = text.replace(state_start, replacement, 1)

          effect_handler_start = "  useEffect(() => {\n    if (!auth.configured) {\n      setGoogleAvailable(false);\n      return;\n    }\n    let active = true;\n    void isSocialProviderEnabled('google').then((enabled) => {\n      if (active) setGoogleAvailable(enabled);\n    });\n    return () => { active = false; };\n  }, [auth.configured]);\n\n  const continueWithGoogle = () => {\n    if (!googleAvailable) return;\n    setError(null);\n    try {\n      auth.continueWithGoogle();\n    } catch (err) {\n      setError(err instanceof Error ? err.message : 'Google sign-in could not be started.');\n    }\n  };\n\n"
          if effect_handler_start not in text:
              raise SystemExit('Google effect/handler block not found in AuthGateView')
          text = text.replace(effect_handler_start, '', 1)
          text = text.replace("\n            {error && <div role=\"alert\" className=\"mt-5 rounded-2xl border border-danger/25 bg-danger-soft p-3 text-xs leading-5 text-danger\">{error}</div>}\n", "")

          gate_google_start = '              <button type="button" disabled={!auth.configured || googleAvailable !== true} onClick={continueWithGoogle}'
          email_button_start = '              <button type="button" onClick={onEmail}'
          if gate_google_start not in text or email_button_start not in text:
              raise SystemExit('Google gate UI markers not found')
          start = text.index(gate_google_start)
          end = text.index(email_button_start, start)
          text = text[:start] + text[end:]
          gate.write_text(text)

          social_buttons = Path('src/components/auth/SocialAuthButtons.tsx')
          text = social_buttons.read_text()
          google_provider = "  { id: 'google', label: 'Google', monogram: 'G' },\n"
          if google_provider not in text:
              raise SystemExit('Google provider not found in SocialAuthButtons')
          social_buttons.write_text(text.replace(google_provider, '', 1))

          dock = Path('src/components/auth/SocialAuthDock.tsx')
          text = dock.read_text()
          text = text.replace("import { Github, Globe2, Laptop, ShieldCheck } from 'lucide-react';", "import { Github, Laptop, ShieldCheck } from 'lucide-react';")
          google_dock = "  { id: 'google', label: 'Google', icon: <Globe2 className=\"h-4 w-4\" /> },\n"
          if google_dock not in text:
              raise SystemExit('Google provider not found in SocialAuthDock')
          dock.write_text(text.replace(google_dock, '', 1))

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Auth UI assertions
        shell: bash
        run: |
          ! grep -q "Google sign-in unavailable" src/components/auth/AuthModal.tsx
          ! grep -q "Google sign-in unavailable" src/components/auth/AuthGateView.tsx
          ! grep -q "Checking Google sign-in" src/components/auth/AuthModal.tsx
          ! grep -q "continueWithGoogle" src/components/auth/AuthGateView.tsx
          ! grep -q "id: 'google'" src/components/auth/SocialAuthButtons.tsx
          ! grep -q "id: 'google'" src/components/auth/SocialAuthDock.tsx
          grep -q "Create secure account" src/components/auth/AuthModal.tsx
          grep -q "Continue with email" src/components/auth/AuthGateView.tsx
          grep -q "auth.signUp" src/components/auth/AuthModal.tsx
          grep -q "auth.signIn" src/components/auth/AuthModal.tsx

      - name: Commit validated auth UI and remove temporary workflow
        shell: bash
        run: |
          git config user.name "SHREYASH SINGH"
          git config user.email "shreyashsinghegi2@gmail.com"
          git rm .github/workflows/remove-google-auth-ui.yml
          git add src/components/auth/AuthModal.tsx src/components/auth/AuthGateView.tsx src/components/auth/SocialAuthButtons.tsx src/components/auth/SocialAuthDock.tsx
          git commit -m "Remove unavailable Google auth UI"
          git push origin HEAD:remove-unavailable-google-auth-ui
