name: Run Financial Scenario Studio repair

on:
  push:
    branches:
      - fix-financial-scenario-studio

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair script
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/fix-financial-scenario-studio.yml').read_text()
          start_marker = '      - name: Repair calculators and add scenario-aware ArthaMind\n'
          run_marker = '        run: |\n'
          end_marker = '\n      - name: Install dependencies\n'
          start = workflow.index(start_marker)
          run_start = workflow.index(run_marker, start) + len(run_marker)
          run_end = workflow.index(end_marker, run_start)
          raw_script = workflow[run_start:run_end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw_script.splitlines())
          exec(compile(script, 'financial-scenario-repair.py', 'exec'), {})

          routes = Path('server/routes.ts')
          text = routes.read_text()
          old_return = "): Record<string, unknown> {\n  if (scenario === 'compound') {"
          new_return = "): any {\n  if (scenario === 'compound') {"
          if old_return not in text:
              raise SystemExit('Could not locate recalculateScenario return type')
          text = text.replace(old_return, new_return, 1)
          old_guard = 'if (!parsed.success) return calculatorValidationError(res, parsed);'
          if text.count(old_guard) != 5:
              raise SystemExit(f'Expected 5 calculator validation guards, found {text.count(old_guard)}')
          text = text.replace(old_guard, 'if (parsed.success === false) return calculatorValidationError(res, parsed);')
          routes.write_text(text)
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Financial engine and route tests
        run: npx vitest run tests/financeEngine.test.ts tests/scenarioRoutes.test.ts tests/aiResponseStandard.test.ts tests/groqService.test.ts
      - name: Commit validated source repair
        run: |
          git config user.name "SHREYASH SINGH"
          git config user.email "shreyashsinghegi2@gmail.com"
          git add server/routes.ts server/financeEngine.ts src/components/scenarios/CalculationResultPanel.tsx src/components/scenarios/ScenariosView.tsx src/components/scenarios/ScenarioAssistantPanel.tsx tests/financeEngine.test.ts tests/scenarioRoutes.test.ts
          git commit -m "Repair Financial Scenario Studio and add ArthaMind analysis"
          git push origin HEAD:fix-financial-scenario-studio
