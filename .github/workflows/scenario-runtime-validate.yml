name: Validate Scenario Studio Runtime

on:
  push:
    branches: [fix-scenario-studio-runtime]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Scenario parity tests
        run: npx vitest run tests/scenarioCalculatorParity.test.ts tests/financeEngine.test.ts
      - name: Production build
        run: npm run build
      - name: Local API smoke test
        shell: bash
        run: |
          PORT=3000 NODE_ENV=production node dist/server.cjs > /tmp/artha-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          curl -fsS -X POST http://127.0.0.1:3000/api/finance/compound-interest -H 'content-type: application/json' -d '{"principal":10000,"annualRatePercent":7,"years":5,"monthlyContribution":200,"compoundingFrequencyPerYear":12}' | grep -q 'finalBalance'
          curl -fsS -X POST http://127.0.0.1:3000/api/finance/quick-ratio -H 'content-type: application/json' -d '{"cash":50000,"marketableSecurities":20000,"receivables":15000,"currentLiabilities":40000}' | grep -q 'quickRatio'
          curl -fsS -X POST http://127.0.0.1:3000/api/finance/cagr -H 'content-type: application/json' -d '{"initialValue":50000,"finalValue":100000,"years":5}' | grep -q 'cagrPercent'
          curl -fsS -X POST http://127.0.0.1:3000/api/finance/break-even -H 'content-type: application/json' -d '{"fixedCosts":120000,"pricePerUnit":100,"variableCostPerUnit":60}' | grep -q 'breakEvenUnits'
          curl -fsS -X POST http://127.0.0.1:3000/api/finance/dti -H 'content-type: application/json' -d '{"monthlyGrossIncome":8000,"monthlyDebtPayments":2400}' | grep -q 'dtiPercent'
          curl -fsS -X POST http://127.0.0.1:3000/api/finance/scenario-assistant -H 'content-type: application/json' -d '{"scenario":"compound","question":"Explain this result","profile":"US","currency":"USD","useExternalContext":false,"inputs":{"principal":10000,"annualRatePercent":7,"years":5,"monthlyContribution":200,"compoundingFrequencyPerYear":12}}' | grep -q 'structuredAnswer'
